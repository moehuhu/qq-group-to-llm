name: Publish Plugin

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm dist-tag（latest / next 等）'
        required: false
        default: 'latest'
        type: string
      dry_run:
        description: '仅构建不发布（dry run）'
        required: false
        default: false
        type: boolean

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org/
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build with yakumo
        run: npm run build

      - name: Publish to npm
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: npm publish --tag "${{ github.event.inputs.tag }}" --access public
